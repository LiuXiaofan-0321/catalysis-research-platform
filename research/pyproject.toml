[project]
name = "catalysis-research-experiments"
version = "0.1.0"
description = "Reproducible Model x Knowledge experiments for catalysis research"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.5,<2",
  "numpy>=2.2,<3",
  "scikit-learn>=1.7,<2",
  "scipy>=1.15,<2",
  "sympy>=1.13,<2",
]

[project.scripts]
catalysis-research = "catalysis_research.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
