[project]
name = "catalysis-research"
version = "0.2.0"
description = "Knowledge-grounded descriptor discovery: Agent vs RAG vs KG+RAG on public materials benchmarks"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "openpyxl>=3.1",
  "rdkit>=2023.9",
]

[project.optional-dependencies]
# Needed only for building or querying the RAG index (literature_pipeline).
knowledge = ["pydantic>=2.8", "PyYAML>=6.0", "httpx>=0.27", "PyMuPDF>=1.24", "pypdf>=5.0", "sentence-transformers>=3.0"]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "literature_pipeline/src"]
testpaths = ["tests", "literature_pipeline/tests"]
