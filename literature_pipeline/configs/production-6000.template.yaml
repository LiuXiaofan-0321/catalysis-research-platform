schema_version: literature_pipeline_config.v1
source: C:/replace/with/explicit/public-paper-directory-or-manifest.jsonl
workspace: ../workspace-production
collection_hint: zeolite_thermocatalysis_public_literature

parser:
  engine: auto
  docling_fallback: true
  min_document_characters: 500
  max_empty_page_ratio: 0.4
  max_replacement_ratio: 0.01
  fail_on_low_quality: true

chunking:
  target_tokens: 500
  overlap_tokens: 60
  min_tokens: 80
  exclude_references: true

extraction:
  enabled: true
  provider: deepseek
  model: deepseek-v4-flash
  base_url: https://api.deepseek.com
  temperature: 0.0
  seed: 20260827
  max_tokens_core: 8000
  max_tokens_data: 8000
  max_context_tokens_core: 7000
  max_context_tokens_data: 7000
  workers: 4
  requests_per_minute: 60
  prompt_version: catalysis-paper-extraction-v2.1

index:
  enabled: true
  backend: auto
  embedding_model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  # Frozen from Hugging Face model metadata on 2026-08-28.
  embedding_revision: e8f8c211226b894fcb81acc59f3b34ba3efd5f42
  embedding_batch_size: 64
  vector_dimensions: 384
  allow_hash_embedding_fallback: false
  top_k_dense: 40
  top_k_lexical: 40
  top_k_final: 12
  max_records_per_paper: 2
  context_token_budget: 6000

execution:
  large_run_threshold: 100
  result_progress_interval: 25
